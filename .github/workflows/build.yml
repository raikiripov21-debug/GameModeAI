name: Build APK — A06

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Dar permisos a Gradle wrapper
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: GameModeAI-A06-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Compilar APK Release (sin firmar)
        run: ./gradlew assembleRelease --no-daemon --build-cache

      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: GameModeAI-A06-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Mostrar tamaño de APKs
        run: |
          echo "=== APKs generados ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
