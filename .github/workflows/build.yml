name: Build APK — A06

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-a06-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-a06-
            ${{ runner.os }}-gradle-

      - name: Dar permisos al wrapper
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ github.run_number }} \
            --no-daemon \
            --build-cache \
            --stacktrace

      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: GameModeAI-A06-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Compilar APK Release
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ github.run_number }} \
            --no-daemon \
            --build-cache \
            --stacktrace

      - name: Subir APK Release
        uses: actions/upload-artifact@v4
        with:
          name: GameModeAI-A06-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Crear GitHub Release con APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          gh release create "v${{ github.run_number }}" \
            --title "GameModeAI A06 v${{ github.run_number }}" \
            --notes "### GameModeAI v${{ github.run_number }} — Samsung Galaxy A06

          Build automático #${{ github.run_number }}

          **Instala directo desde la app** o descarga el APK aquí.

          Optimizado para:
          - Samsung Galaxy A06 (Exynos 850)
          - 3GB RAM
          - Pantalla LCD 60Hz" \
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mostrar tamaño de APKs
        run: |
          echo "=== APKs generados ==="
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
